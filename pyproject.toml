[project]
name = "cfv-checksum-tool"
# The version is set only in checksum_file_tool.py (__version__); don't add it here.
dynamic = ["version"]
description = "Windows CFV checksum file management CLI tool"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
checksum-file-tool = "checksum_file_tool:cli"
